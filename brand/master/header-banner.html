<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Candelx header banner</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  .cx-banner {
    --banner-bar:      #002536; /* dark section  — navy-800 */
    --banner-block:    #007ea7; /* main blue     — teal-600 */
    --banner-chip-1:   #2c94b6; /* chevron 1     — teal-500 */
    --banner-chip-2:   #5dadc7; /* chevron 2     — teal-400 */
    --banner-hairline: #ffffff; /* divider line  — white    */
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
<svg class="cx-banner" viewBox="0 0 1200 148" preserveAspectRatio="none" role="img" aria-label="Header banner">
  <polygon fill="var(--banner-block)" points="685,0 1200,0 1200,143 806,143"/>
  <polygon fill="var(--banner-bar)" points="0,0 685,0 721,42 0,42"/>
  <polygon fill="var(--banner-chip-1)" points="623,45 702,45 785,143 706,143"/>
  <polygon fill="var(--banner-chip-2)" points="543,45 596,45 650,108 597,108"/>
  <path fill="none" stroke="var(--banner-hairline)" stroke-width="2" d="M740 0 L836 112 H1200"/>
  <path fill="none" stroke="var(--banner-hairline)" stroke-width="2" d="M0 1 H1200 M0 147 H1200"/>
</svg>
</body>
</html>
